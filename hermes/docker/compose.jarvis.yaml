# Jarvis CoS — single instance (one data volume inside Docker)
#
# Default: named volume `jarvis-hermes-data` (no host path to manage).
# Optional bind mount (e.g. Portainer host path):
#   JARVIS_VOLUME_SPEC=/path/on/host docker compose -f hermes/docker/compose.jarvis.yaml up -d
#
# Local smoke (preferred):
#   ./hermes/scripts/jarvis-local-smoke.sh
#
# Topology: docs/agents/runbooks/multi-agent-config-lanes.md

name: jarvis-hermes

services:
  jarvis:
    image: ${JARVIS_HERMES_IMAGE:-ghcr.io/mastercodeyoda/jarvis-hermes:main}
    container_name: jarvis-hermes
    restart: unless-stopped
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_HOME: /opt/data
    volumes:
      # Named volume by default. Override with absolute host path via JARVIS_VOLUME_SPEC.
      - ${JARVIS_VOLUME_SPEC:-jarvis-hermes-data}:/opt/data
    # Socket Mode Slack needs no published ports.

volumes:
  jarvis-hermes-data:
    name: jarvis-hermes-data

# Jarvis Hermes profile policy (versioned in agent-tools).
# Secrets do NOT belong here — use profile .env / auth.json after install.
# Adaptive state (project list, etc.) lives under live profile state/ — not here.
# Apply substitutes __HERMES_SKILLS_DIR__ with the absolute jarvis skills path.
# Docker image: placeholder becomes /opt/jarvis/skills (baked jarvis product pack).

model:
  # Default: xAI Grok via SuperGrok OAuth (same class as Spectral/Wildwood).
  # Login: hermes -p jarvis auth add xai-oauth --type oauth  (device/browser PKCE flow)
  # Tokens live in profile auth.json — not .env. API-key fallback: XAI_API_KEY + provider xai.
  default: grok-4
  provider: xai-oauth

memory:
  # CoS may enable later; v1 project lens uses explicit state/ files (adaptive lane).
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true

skills:
  write_approval: true
  creation_nudge_interval: 0
  # Image: /opt/jarvis/skills · Host packaging: JARVIS_SKILLS_ROOT (default ~/.jarvis/skills)
  external_dirs:
    - __HERMES_SKILLS_DIR__

approvals:
  mode: manual
  deny:
    - "rm -rf /*"
    - "git push --force*"
    - "*curl*|*bash*"
    - "*curl*|*sh*"

terminal:
  backend: local
  # No fixed product-repo cwd — CoS is not factory-bound to a single git root.

platform_toolsets:
  cli:
    - file
    - terminal
    - skills
    - web
  slack:
    - file
    - terminal
    - skills
    - web

# Ops: replace placeholders before live Slack smoke (never commit real IDs).
slack:
  # Lab/redeploy churn otherwise pings every "active" Slack session (and home
  # channel) with "Gateway shutting down — task interrupted." CoS home is often
  # a personal DM — keep those quiet; Hermes still drains cleanly without the ping.
  gateway_restart_notification: false
  channel_skill_bindings:
    - id: "REPLACE_WITH_JARVIS_HOME_CHANNEL_ID"
      skills:
        # Flat install id after pack (src/jarvis/research-digest → product leaf research-digest)
        - research-digest

auxiliary:
  compression:
    provider: anthropic
    model: claude-haiku-4-5
    reasoning_effort: low
  title_generation:
    provider: anthropic
    model: claude-haiku-4-5

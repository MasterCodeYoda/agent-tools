name: context-compact-soft
purpose: >
  Mid-item reclaim: durable IC + workflow_reclaim signal with clean-session host_command
  (/clear or /new), then continue same unit after user/orchestrator clears. Default is clean
  session not /compact. End-of-item handoff out of scope.

unit_path: .agent-tools/planning/smoke-unit

harnesses:
  - claude
  - grok
  - opencode

hard_invariants:
  - session_state_exists
  - ic_heading_present
  - ic_has_goal_or_next
  - compact_focus_present
  - resume_loads_present
  - resume_loads_unit_relative
  - no_product_leak_names

observation_checklist:
  - id: mid-item-not-handoff
    expect: IC frames remaining work NEXT not unit complete handoff
  - id: clean-session-host-command
    expect: host_command clear or new or clean-session reclaim signal
  - id: continue-same-unit
    expect: workflow continue same unit after reclaim not portfolio invent

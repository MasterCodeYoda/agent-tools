name: context-compact-soft
purpose: >
  Mid-item context-compact: agent writes IC, reclaims the window (host compact or clean
  session), then resumes the same unit workstream. IC-only stop without reclaim+continue is
  incomplete. End-of-item handoff is out of scope (no compact).

unit_path: .agent-tools/planning/smoke-unit

harnesses:
  - claude
  - grok
  - opencode

hard_invariants:
  - session_state_exists
  - ic_heading_present
  - ic_has_goal_or_next
  - compact_focus_present
  - resume_loads_present
  - resume_loads_unit_relative
  - no_product_leak_names

observation_checklist:
  - id: mid-item-not-handoff
    expect: IC frames remaining work NEXT not unit complete handoff
  - id: reclaim-then-continue
    expect: evidence of host compact or continue-after-reclaim same workstream not IC-only stop
